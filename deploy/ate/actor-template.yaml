# ProtoJSON-shaped ActorTemplate for kubectl ate create actor-template -f …
# Replace IMAGE_REPLACE_ME with a digest-pinned (or tag) reference to the
# deploy/ate/workload image.
metadata:
  atespace: shuttle
  name: shuttle-claude
containers:
- name: agent
  image: IMAGE_REPLACE_ME
resources:
  limits:
    cpuMillicores: 2000
    memoryBytes: "4294967296"
snapshotConfig:
  preferredFidelity: SNAPSHOT_FIDELITY_MEMORY
