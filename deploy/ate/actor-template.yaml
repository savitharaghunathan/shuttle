# ProtoJSON-shaped ActorTemplate for kubectl ate create actor-template -f …
# Replace IMAGE_REPLACE_ME with a digest-pinned reference
# (repo@sha256:… — ate rejects mutable tags).
metadata:
  atespace: shuttle
  name: shuttle-claude
containers:
- name: agent
  image: IMAGE_REPLACE_ME
resources:
  limits:
    cpuMillicores: 2000
    memoryBytes: "4294967296"
snapshotConfig:
  preferredFidelity: SNAPSHOT_FIDELITY_MEMORY
