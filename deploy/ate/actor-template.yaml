# ProtoJSON-shaped ActorTemplate for kubectl ate create actor-template -f …
# Replace IMAGE_REPLACE_ME with a digest-pinned reference
# (repo@sha256:… — ate rejects mutable tags).
metadata:
  atespace: shuttle
  name: shuttle-claude
workerSelector:
  matchLabels:
    workload: shuttle
containers:
- name: agent
  image: IMAGE_REPLACE_ME
  env:
  - name: SSL_CERT_FILE
    value: /run/ate/egress-trust-bundle/trust-bundle.pem
  - name: GIT_SSL_CAINFO
    value: /run/ate/egress-trust-bundle/trust-bundle.pem
  - name: NODE_EXTRA_CA_CERTS
    value: /run/ate/egress-trust-bundle/trust-bundle.pem
  volumeMounts:
  - name: system-info
    mountPath: /run/ate
resources:
  limits:
    cpuMillicores: 500
    memoryBytes: "536870912"
snapshotConfig:
  preferredFidelity: SNAPSHOT_FIDELITY_MEMORY
  goldenSnapshotConfig:
    mode: GOLDEN_SNAPSHOT_MODE_DISABLED
volumes:
- name: system-info
  systemInfo:
    dataSources:
    - trustBundle:
        names:
        - egress-mitm.ate.dev
        - system-roots.ate.dev
        path: egress-trust-bundle/trust-bundle.pem
