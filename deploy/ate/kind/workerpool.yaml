# Applied by apply-workerpool.sh after ko substitutes workerImage.
apiVersion: v1
kind: Namespace
metadata:
  name: shuttle
---
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: shuttle
  namespace: shuttle
  labels:
    workload: shuttle
spec:
  # Two replicas: a golden-snapshot actor may occupy one while smoke runs.
  replicas: 2
  workerImage: WORKER_IMAGE_REPLACE_ME
  sandboxClasses:
  - name: gvisor
  template:
    # Capacity must cover ActorTemplate limits (500m / 512Mi) with headroom.
    resources:
      limits:
        cpu: "1"
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 2Gi
