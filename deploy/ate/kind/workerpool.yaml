# Applied by apply-workerpool.sh after ko substitutes workerImage.
apiVersion: v1
kind: Namespace
metadata:
  name: shuttle
---
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: shuttle
  namespace: shuttle
  labels:
    workload: shuttle
spec:
  replicas: 1
  workerImage: WORKER_IMAGE_REPLACE_ME
  sandboxClasses:
  - name: gvisor
  template:
    # Capacity must cover ActorTemplate limits (smoke: 500m/512Mi).
    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 1Gi
